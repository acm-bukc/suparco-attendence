<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUPARCO Industrial Visit Attendance</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="registration-page">
    <section class="registration-card" aria-labelledby="page-title">
      <div class="card-accent" aria-hidden="true"></div>
      <div class="logo"><img src="acmlogo-transparent.png" alt="ACM logo"></div>
      <p class="organization">Bahria University Karachi</p>
      <h1 id="page-title">Attendance Check-in</h1>
      <p class="intro">Mark your attendance for the industrial visit at SUPARCO.</p>

      <form id="attendanceForm" novalidate>
        <label class="field" for="enrollment">
          <span>Enrollment number <b>Required</b></span>
          <input id="enrollment" name="enrollment" type="text" autocomplete="off" placeholder="Enter your enrollment number" required>
        </label>
        <button type="submit"><span>Mark attendance</span><span aria-hidden="true">&#8594;</span></button>
        <div id="formMessage" class="form-message" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>
  <div class="attendance-modal" id="attendanceModal" role="dialog" aria-modal="true" aria-labelledby="attendanceModalTitle" hidden>
    <div class="attendance-modal-card">
      <img src="acmlogo-transparent.png" alt="ACM logo">
      <h2 id="attendanceModalTitle">Attendance marked</h2>
      <p>Enjoy your visit to SUPARCO!</p>
      <button type="button" id="closeAttendanceModal">Continue</button>
    </div>
  </div>
  <script src="attendance.js"></script>
</body>
</html>
